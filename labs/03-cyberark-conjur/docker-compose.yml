services:
  database:
    image: postgres:15
    environment:
      # Lab only. Never run a real database with trust authentication.
      POSTGRES_HOST_AUTH_METHOD: trust

  conjur:
    image: cyberark/conjur
    command: server
    environment:
      DATABASE_URL: postgres://postgres@database/postgres
      CONJUR_DATA_KEY: ${CONJUR_DATA_KEY:-}
    depends_on:
      - database
    ports:
      # Bound to localhost only. Plain HTTP is acceptable for a local lab, not for anything else.
      - "127.0.0.1:8080:80"
